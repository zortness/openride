[package]
name = "content-builder"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ride-core = { path = "../ride-core" }
serde = { version = "1.0.229", features = ["derive"] }
# Source manifests are compared across Python/Rust; preserve IEEE-754 values exactly.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
